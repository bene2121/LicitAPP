# Configuración de seguridad de LicitApp (Streamlit lee este archivo desde la raíz del proyecto).
[server]
# Solo escucha en este equipo: nadie en la red local puede abrir la app ni usar tus credenciales.
address = "127.0.0.1"
port = 8501
# Protección contra peticiones falsificadas desde otras páginas web.
enableXsrfProtection = true
enableCORS = true

[browser]
gatherUsageStats = false

[global]
developmentMode = false
