# Limite de peticiones por IP (frena fuerza bruta y abuso). Va en el contexto http.
limit_req_zone $binary_remote_addr zone=secop_api:10m rate=10r/s;

server {
    listen 80;
    server_name api.secop-automatizador.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name api.secop-automatizador.com;
    ssl_certificate     /etc/letsencrypt/live/api.secop-automatizador.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.secop-automatizador.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    client_max_body_size 1m;
    location / {
        limit_req zone=secop_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
